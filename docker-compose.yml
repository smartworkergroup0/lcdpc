services:
  postgres:
    image: postgres:16
    container_name: lcdpc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lcdpc}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      TZ: UTC
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-lcdpc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lcdpc-system
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      TZ: UTC
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: ${DB_NAME:-lcdpc}
      DB_SSL: ${DB_SSL:-disable}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      OAUTH2_ISSUER: ${OAUTH2_ISSUER:-http://localhost:8080}
      OAUTH2_AUDIENCE: ${OAUTH2_AUDIENCE:-lcdpc-api}
      OAUTH2_ACCESS_TOKEN_TTL_MINUTES: ${OAUTH2_ACCESS_TOKEN_TTL_MINUTES:-60}
      OAUTH2_REFRESH_TOKEN_TTL_DAYS: ${OAUTH2_REFRESH_TOKEN_TTL_DAYS:-30}
      OAUTH2_AUTHORIZATION_CODE_TTL_MINUTES: ${OAUTH2_AUTHORIZATION_CODE_TTL_MINUTES:-10}
      PASETO_KEY_PATH: ${PASETO_KEY_PATH:-}
      PASETO_DECRYPTION_KEY: ${PASETO_DECRYPTION_KEY:-}
      PASETO_SA_KEY_PATH: ${PASETO_SA_KEY_PATH:-}
      PASETO_SA_DECRYPTION_KEY: ${PASETO_SA_DECRYPTION_KEY:-}
      AUTH_PASSWORD_RESET_TTL_MINUTES: ${AUTH_PASSWORD_RESET_TTL_MINUTES:-30}
      AUTH_REVOKE_SESSIONS_ON_PASSWORD_RESET: ${AUTH_REVOKE_SESSIONS_ON_PASSWORD_RESET:-true}
      RESEND_APITOKEN: ${RESEND_APITOKEN:-}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS:-}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-noop}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      CATALOG_DOMAIN: ${CATALOG_DOMAIN:-http://localhost:8080}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GOOGLE_REDIRECT_URI: ${AUTH_GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/auth/register/google/callback}
      AUTH_GOOGLE_SCOPE: ${AUTH_GOOGLE_SCOPE:-openid email profile}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-noreply@lcdpc.local}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - static_data:/app/static/img
      # PASETO v2.local symmetric keys (64 hex chars each).
      # Must exist before running `docker compose up`. Generate with:
      #   openssl rand -hex 32 > api/paseto.key
      #   openssl rand -hex 32 > api/paseto_sa.key
      # Optional: encrypt with -encrypt-paseto-key flag and set PASETO_DECRYPTION_KEY.
      - ./api/paseto.key:/app/paseto.key:ro
      - ./api/paseto_sa.key:/app/paseto_sa.key:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pg_data:
  static_data:
