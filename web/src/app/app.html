@if (showStoreShell() && !isAdminRoute()) {
  <app-header
    [branches]="branchStore.branches()"
    [selectedBranchId]="branchStore.selectedBranchId()"
    (branchChange)="selectBranch($event)"
  ></app-header>

  <main class="landing-shell" [class.cart-shell]="isCartRoute()">
    <router-outlet></router-outlet>
  </main>

  <nav class="mobile-nav" aria-label="Acceso rápido móvil">
    <button class="mobile-nav-item active" type="button">
      <span class="pi pi-bars"></span>
      <span>Catálogo</span>
    </button>
    <button class="mobile-nav-item" type="button" (click)="openBranchDialog()">
      <span class="pi pi-map-marker"></span>
      <span>Ubicación</span>
    </button>
    <button class="mobile-nav-item" type="button" (click)="goToCart()">
      <span class="pi pi-shopping-cart"></span>
      <span>Carrito</span>
      <span class="mobile-badge">{{ cartStore.totalItems() }}</span>
    </button>
  </nav>

  <app-branch-selector-dialog #branchDialog></app-branch-selector-dialog>

  <app-footer></app-footer>
} @else if (!isAdminRoute()) {
  <main class="auth-shell auth-shell--page">
    <router-outlet></router-outlet>
  </main>
} @else {
  <router-outlet></router-outlet>
}

@if (loadingState.isLoading()) {
  <div class="loading-overlay" aria-live="polite" aria-busy="true" role="status">
    <div class="loading-overlay__panel">
      <p-progressSpinner styleClass="loading-spinner" strokeWidth="4"></p-progressSpinner>
    </div>
  </div>
}
