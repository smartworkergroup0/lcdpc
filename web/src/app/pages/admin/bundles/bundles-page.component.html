<section class="bundles-page">
  <div class="page-header">
    <h1>Combos</h1>
    @if (canCreate()) {
      <p-button label="Nuevo Combo" icon="pi pi-plus" (onClick)="openCreateDialog()"></p-button>
    }
  </div>

  <p-toolbar styleClass="admin-toolbar">
    <ng-template pTemplate="start">
      <p-iconfield>
        <p-inputicon><i class="pi pi-search"></i></p-inputicon>
        <input pInputText type="text" placeholder="Buscar por nombre..." [(ngModel)]="filterName" (keyup.enter)="applyFilters()" />
      </p-iconfield>
      <input pInputText type="text" placeholder="Codigo..." [(ngModel)]="filterCode" (keyup.enter)="applyFilters()" style="width: 120px" />
    </ng-template>
    <ng-template pTemplate="end">
      <p-select [options]="statusOptions" [(ngModel)]="filterStatus" optionLabel="label" optionValue="value" placeholder="Todos los estados" [showClear]="true" (onChange)="applyFilters()"></p-select>
      <p-select [options]="categoryStore.categoryOptions()" [(ngModel)]="filterCategoryId" optionLabel="label" optionValue="value" placeholder="Todas las categorias" [showClear]="true" (onChange)="applyFilters()"></p-select>
    </ng-template>
  </p-toolbar>

  <p-table [value]="bundles()" [lazy]="true" [paginator]="true"
           [rows]="pageSize" [totalRecords]="totalCount()" [loading]="loading()"
           (onLazyLoad)="loadBundles($event)" styleClass="admin-table">
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 60px">Img</th>
        <th>Nombre</th>
        <th>Codigo</th>
        <th>Estado</th>
        <th style="width: 160px">Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-bundle>
      <tr>
        <td>
          <img [src]="resolveImage(bundle.img)" class="bundle-thumb"
               loading="lazy" (error)="onImageError($event)" />
        </td>
        <td>{{ bundle.name }}</td>
        <td><code>{{ bundle.code }}</code></td>
        <td>
          <p-tag [value]="bundle.status === 'Active' ? 'Activo' : 'Inactivo'" [severity]="statusSeverity(bundle.status)" />
          @if (bundle.blocksProductStock) {
            <p-tag value="Cadena" severity="info" />
          }
        </td>
        <td>
          @if (canUpdate()) {
            <p-button icon="pi pi-pencil" [text]="true" [rounded]="true"
                      (onClick)="openEditDialog(bundle)" pTooltip="Editar"></p-button>
            @if (bundle.status === 'Active') {
              <p-button icon="pi pi-pause" [text]="true" [rounded]="true" severity="warn"
                        (onClick)="toggleActive(bundle)" pTooltip="Desactivar"></p-button>
            } @else {
              <p-button icon="pi pi-play" [text]="true" [rounded]="true" severity="success"
                        (onClick)="toggleActive(bundle)" pTooltip="Activar"></p-button>
            }
          }
          @if (canDelete()) {
            <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger"
                      (onClick)="confirmDelete(bundle)" pTooltip="Eliminar"></p-button>
          }
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="empty-state">No hay combos registrados</td>
      </tr>
    </ng-template>
  </p-table>
</section>

<app-bundle-form-dialog
  [visible]="dialogVisible()"
  [bundle]="selectedBundle()"
  (visibleChange)="dialogVisible.set($event)"
  (saved)="onDialogClose(true)"
  (closed)="onDialogClose(false)"
></app-bundle-form-dialog>

<p-confirmDialog />
<p-toast />
