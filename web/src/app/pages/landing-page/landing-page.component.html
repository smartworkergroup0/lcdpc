<app-hero
  [heroSlides]="heroSlides"
  [activeHeroIndex]="activeHeroIndex()"
  [search]="search()"
  (slideSelect)="activeHeroIndex.set($event)"
  (searchChange)="searchSubject.next($event)"
  (searchSubmit)="goToAdvancedSearch($event)"
></app-hero>

<app-catalog
  [categories]="categoryStore.filterOptions()"
  [selectedCategoryId]="selectedCategoryId()"
  [products]="filteredProducts()"
  [negativeStock]="systemConfigStore.negativeStock()"
  [loading]="loading()"
  [loadingMore]="loadingMore()"
  (categorySelect)="selectCategory($event)"
  (increment)="incrementQuantity($event)"
  (decrement)="decrementQuantity($event)"
  (quantityChange)="onQuantityInputChange($event)"
  (addToCart)="addToCart($event)"
  (productClick)="openDetail($event)"
></app-catalog>

<app-branches [branches]="branches()"></app-branches>

<app-product-detail-dialog
  [visible]="detailDialogVisible()"
  (visibleChange)="detailDialogVisible.set($event)"
  [product]="selectedProduct()"
  [negativeStock]="systemConfigStore.negativeStock()"
  (addToCart)="onDetailAddToCart($event)"
></app-product-detail-dialog>
